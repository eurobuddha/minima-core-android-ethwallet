plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.eurobuddha.ethwallet'
    compileSdk 36

    defaultConfig {
        applicationId "com.eurobuddha.ethwallet"
        minSdk 28
        targetSdk 35
        versionCode 205
        versionName "0.2.5"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    signingConfigs {
        // Minima family release key. Credentials come from ~/.gradle/gradle.properties
        // (outside every repo), so nothing secret is ever committed. On a machine without
        // those props this config stays empty and release falls back to debug signing.
        release {
            def ksFile = project.findProperty('MINIMA_FAMILY_RELEASE_STORE_FILE')
            if (ksFile != null) {
                storeFile file(ksFile)
                storePassword project.findProperty('MINIMA_FAMILY_RELEASE_STORE_PASSWORD')
                keyAlias project.findProperty('MINIMA_FAMILY_RELEASE_KEY_ALIAS')
                keyPassword project.findProperty('MINIMA_FAMILY_RELEASE_KEY_PASSWORD')
            }
        }
    }


    buildTypes {
        release {
            // Shrinking is required, not cosmetic: unshrunk web3j alone is ~17.9 MB of dex, which
            // leaves no headroom for a second chain's crypto library. See proguard-rules.pro for
            // the reflective call sites that must be kept.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sign release with the debug keystore, matching the rest of the minima-core-android ecosystem.
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    buildFeatures {
        buildConfig true
    }
}

dependencies {

    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout

    // Minima Core IPC client SDK — used only to derive the same ETH key as minimaSwap
    // (`seedrandom modifier:ethbridge`). The wallet also works node-free via private-key import.
    implementation files('libs/minimaapi.aar')

    // Encrypted, Keystore-backed store for an IMPORTED private key (never plain prefs).
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'

    // QR: generate the receive address + scan a recipient address.
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'

    // Ethereum: key derivation (secp256k1), legacy tx signing (RLP), ABI encode/decode. JSON-RPC is
    // done over HttpURLConnection, so only the pure-Java web3j modules (no okhttp/core HTTP stack).
    implementation 'org.web3j:crypto:4.9.8'
    implementation 'org.web3j:abi:4.9.8'
    implementation 'org.web3j:rlp:4.9.8'
    implementation 'org.web3j:utils:4.9.8'
}
